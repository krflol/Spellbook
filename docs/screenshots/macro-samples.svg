<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Three included Spellbook samples: Charge dance, Cat Prowl, and Form attack. Illustrated code cards."><rect width="1200" height="560" rx="16" fill="#111820"/><text x="40" y="51" fill="#eef2f4" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600">Start from a sample. Make it yours.</text><text x="1158" y="47" fill="#87a4b4" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end" letter-spacing="1.3">3 OF 36 INCLUDED SAMPLES</text><rect x="40" y="87" width="1120" height="123" rx="9" fill="#17212c" stroke="#2b3d4b"/><rect x="40" y="104" width="3" height="89" rx="1" fill="#e1bc70"/><text x="64" y="132" fill="#e1bc70" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Stance dancing</text><text x="64" y="163" fill="#9db1bf" font-family="Segoe UI,Arial,sans-serif" font-size="15" >Warrior · Charge dance</text><text x="350" y="132" font-family="Consolas,monospace" font-size="18" xml:space="preserve"><tspan fill="#dce4eb"></tspan><tspan fill="#8dc8f1">#showtooltip</tspan><tspan fill="#dce4eb"> Charge</tspan></text><text x="350" y="168" font-family="Consolas,monospace" font-size="18" xml:space="preserve"><tspan fill="#dce4eb"></tspan><tspan fill="#8dc8f1">/cast</tspan><tspan fill="#dce4eb"> [</tspan><tspan fill="#c1b0f7">nostance</tspan><tspan fill="#dce4eb">:</tspan><tspan fill="#e1bc70">1</tspan><tspan fill="#dce4eb">] Battle Stance; Charge</tspan></text><rect x="40" y="224" width="1120" height="123" rx="9" fill="#17212c" stroke="#2b3d4b"/><rect x="40" y="241" width="3" height="89" rx="1" fill="#70d7bd"/><text x="64" y="269" fill="#70d7bd" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Shapeshifting</text><text x="64" y="300" fill="#9db1bf" font-family="Segoe UI,Arial,sans-serif" font-size="15" >Druid · Cat Prowl</text><text x="350" y="269" font-family="Consolas,monospace" font-siz