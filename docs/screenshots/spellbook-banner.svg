<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">Spellbook — World of Warcraft macros inside VS Code</title>
  <desc id="description">Spellbook's gold book emblem, a highlighted Cat Prowl macro, and its IntelliSense, sample library, and revision history features. An illustrated product banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212c"/><stop offset="1" stop-color="#0c1219"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#317e74" stop-opacity=".2"/><stop offset="1" stop-color="#317e74" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <ellipse cx="1000" cy="150" rx="410" ry="330" fill="url(#glow)"/>
  <path d="M38 0h1124" stroke="#e1bc70" stroke-width="3" opacity=".7"/>
  <g transform="translate(58 63) scale(2.7)" fill="none" stroke="#e1bc70" stroke-width="1.3" stroke-linejoin="round">
    <path d="M12 7C9 4.7 5.7 4.5 2 5v15c4-.7 7-.4 10 1 3-1.4 6-1.7 10-1V5c-3.7-.5-7-.3-10 2zm0 0v14M5 9c1.5-.1 3 .2 4.5.8M5 13c1.5-.1 3 .2 4.5.8M14.5 9.8c1.5-.6 3-.9 4.5-.8M14.5 13.8c1.5-.6 3-.9 4.5-.8"/>
    <path fill="#64cfb9" stroke="none" d="m12 0 .7 2.3L15 3l-2.3.7L12 6l-.7-2.3L9 3l2.3-.7z"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="143" y="118" fill="#f4f3ec" font-size="58" font-weight="650" letter-spacing="-2">Spellbook</text>
    <text x="64" y="184" fill="#dce3e9" font-size="28">World of Warcraft macros.</text>
    <text x="64" y="222" fill="#e1bc70" font-size="28">Inside VS Code.</text>
    <text x="64" y="284" fill="#a8bac6" font-size="17">IntelliSense</text>
    <circle cx="169" cy="278" r="2" fill="#526373"/>
    <text x="186" y="284" fill="#a8bac6" font-size="17">36 samples</text>
    <circle cx="292" cy="278" r="2" fill="#526373"/>
    <text x="309" y="284" fill="#a8bac6" font-size="17">Revision history</text>
    <text x="64" y="321" fill="#708797" font-size="13" letter-spacing="1.6">WRITE. CHECK. COPY INTO WOW.</text>
  </g>
  <g transform="translate(624 58)">
    <rect width="520" height="268" rx="12" fill="#121b25" stroke="#30414e"/>
    <path d="M0 54h520" stroke="#30414e"/>
    <text x="26" y="34" fill="#e3e6e6" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Cat Prowl</text>
    <rect x="423" y="15" width="72" height="25" rx="12" fill="#16362f"/>
    <text x="459" y="32" text-anchor="middle" fill="#80d8bf" font-family="Segoe UI,Arial,sans-serif" font-size="12">DRUID</text>
    <g font-family="Consolas,Courier New,monospace" font-size="17">
      <text x="26" y="102"><tspan fill="#8dc8f1">#showtooltip</tspan><tspan fill="#e3e6e6"> Prowl</tspan></text>
      <text x="26" y="141"><tspan fill="#8dc8f1">/cast</tspan><tspan fill="#e3e6e6"> [</tspan><tspan fill="#bcacf4">noform</tspan><tspan fill="#e3e6e6">:</tspan><tspan fill="#e1bc70">3</tspan><tspan fill="#e3e6e6">] !Cat Form</tspan></text>
      <text x="26" y="180"><tspan fill="#8dc8f1">/cast</tspan><tspan fill="#e3e6e6"> [</tspan><tspan fill="#bcacf4">nocombat,nostealth</tspan><tspan fill="#e3e6e6">] !Prowl</tspan></text>
    </g>
    <path d="M0 214h520" stroke="#263643"/>
    <circle cx="31" cy="241" r="4" fill="#64cfb9"/>
    <text x="44" y="246" fill="#91b6ae" font-family="Segoe UI,Arial,sans-serif" font-size="13">Form-sensitive macros, with context.</text>
  </g>
</svg>
