name: Desktop Windows checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'Cargo.toml', 'Cargo.lock', 'build.rs', 'scripts/package.ps1', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'assets/**', 'Cargo.toml', 'Cargo.lock', 'build.rs', 'scripts/package.ps1', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Tests
        run: cargo +stable test --locked --all-targets
      - name: Lints
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Release package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Spellbook-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
